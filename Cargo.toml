[workspace]
members = ["crates/ui", "crates/idle-manager"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
knuffel = "3"
libc = "0.2"
pango = "0.22"
tokio = { version = "1", features = ["rt", "macros", "signal", "net", "time", "process", "io-util"] }
tracing = "0.1"
wayland-client = "0.31"
rust-wl-ui = { path = "crates/ui" }

# Whole-program optimisation, tuned for size: the daemon is idle, so speed does not matter.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
